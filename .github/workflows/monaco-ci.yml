name: Monaco CI

on:
  push:
    paths:
      - monaco/**
      - .github/workflows/monaco-ci.yml
      - .github/workflows/monaco-release.yml
  pull_request:
    paths:
      - monaco/**
      - .github/workflows/monaco-ci.yml
      - .github/workflows/monaco-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.14.0, 24]
    defaults:
      run:
        working-directory: monaco
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: monaco/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:packages
      - run: npm pack --workspaces --dry-run
